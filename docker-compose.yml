services:
  backend:
    build: ./backend
    container_name: autotrade-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # 容器内固定用绝对路径，数据落在命名卷里，重建容器不丢
      DATABASE_URL: sqlite:////app/data/autotrade.db
    volumes:
      - autotrade-data:/app/data
    ports:
      # 仅本机可访问，需要远程调接口请走 SSH 隧道或前端反代
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    container_name: autotrade-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  autotrade-data:
